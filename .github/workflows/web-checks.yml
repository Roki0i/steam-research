name: Web app checks
on:
  push:
    paths: ['web/**', '.github/workflows/web-checks.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check web/app.mjs
      - run: node --test web/tests/model.test.mjs
