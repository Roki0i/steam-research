name: Deploy Steam Player Observatory to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test published data and browser modules
        run: |
          node --test web/tests/*.test.mjs
          node --check web/app.mjs
          node --check web/csv.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Public desktop/mobile browser smoke
    needs: [validate, deploy]
    if: ${{ always() && needs.validate.result == 'success' && (github.event_name == 'pull_request' || needs.deploy.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r web/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python web/tests/live_site_smoke.py
      - name: Upload actual public-site screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-public-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
